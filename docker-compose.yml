services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Official SQL Server images are amd64-only. Required on Apple Silicon;
    # a no-op on x86_64 hosts.
    platform: linux/amd64
    restart: unless-stopped
    # No `user:` override here on purpose. The 2022 image already runs sqlservr
    # as the mssql account, and pinning a different uid/gid stops it creating
    # the /.system directory it needs at startup.
    security_opt:
      - no-new-privileges:true
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          # SQL Server refuses to start below 2 GB.
          memory: ${DB_MEMORY_LIMIT:-4g}
          cpus: "${DB_CPU_LIMIT:-2.0}"

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Server=db;Database=OpenQuiz;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__Issuer: ${JWT_ISSUER:-openquiz}
      Jwt__Audience: ${JWT_AUDIENCE:-openquiz}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_DAYS:-30}
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-no-reply@openquiz.local}
      Smtp__FromName: ${SMTP_FROM_NAME:-OpenQuiz}
      Smtp__UseStartTls: ${SMTP_USE_STARTTLS:-true}
      App__PublicUrl: ${PUBLIC_URL:-http://localhost:8080}
      App__AdminEmail: ${ADMIN_EMAIL:-}
      Cors__AllowedOrigins: "${PUBLIC_URL:-http://localhost:8080},http://localhost:8080,http://127.0.0.1:8080"
      Realtime__RedisConnectionString: ${REDIS_CONNECTION_STRING:-}
      Observability__PrometheusEnabled: ${PROMETHEUS_ENABLED:-false}
      Observability__OtlpEndpoint: ${OTLP_ENDPOINT:-}
      Billing__Enabled: ${BILLING_ENABLED:-false}
      Billing__Provider: ${BILLING_PROVIDER:-manual}
      Billing__DefaultPlanCode: ${BILLING_DEFAULT_PLAN:-unlimited}
      Billing__LegacyPlanCode: ${BILLING_LEGACY_PLAN:-}
      Billing__LegacyCutoffUtc: ${BILLING_LEGACY_CUTOFF:-}
      Billing__Currency: ${BILLING_CURRENCY:-TRY}
      Billing__WebhookSecret: ${BILLING_WEBHOOK_SECRET:-}
    ports:
      - "${API_PORT:-5080}:8080"
    volumes:
      - api-logs:/app/logs
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-1g}
          cpus: "${API_CPU_LIMIT:-1.5}"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL-}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    ports:
      - "${WEB_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-256m}
          cpus: "${WEB_CPU_LIMIT:-0.5}"

volumes:
  mssql-data:
  api-logs:
